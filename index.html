<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>給你的一個網頁</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #d6f0ff);
    text-align: center;
    padding: 16px;
    transition: background 0.5s;
  }
  h1 {
    font-size: clamp(1.4em, 6vw, 2em);
    color: #ff4f9a;
    margin-bottom: 10px;
    word-break: break-word;
  }
  p {
    color: #444;
    font-size: clamp(0.95em, 4vw, 1.1em);
    word-break: break-word;
    line-height: 1.6;
  }
  .btn {
    margin-top: 30px;
    padding: 14px 20px;
    font-size: clamp(0.9em, 4vw, 1.1em);
    border: none;
    border-radius: 999px;
    background: #ff6fa5;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.1s;
    max-width: 100%;
    white-space: normal;
  }
  .btn:active { transform: scale(0.95); }
  #escapeBtn {
    position: relative;
    margin-top: 40px;
  }
  #count {
    margin-top: 20px;
    font-size: clamp(1em, 4.5vw, 1.3em);
    font-weight: bold;
    color: #333;
    word-break: break-word;
  }
  #bombArea {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .floaty {
    position: absolute;
    font-size: clamp(0.9em, 4.5vw, 1.5em);
    animation: floatUp 3s ease-in forwards;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-300px) rotate(20deg); }
  }
  #fakeDead {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    color: #0f0;
    font-family: monospace;
    font-size: clamp(0.9em, 4.5vw, 1.2em);
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
  }
  #card {
    background: white;
    border-radius: 20px;
    padding: 32px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 420px;
  }
</style>
</head>
<body>

<div id="card">
  <h1>哈囉 👋</h1>
  <p id="mainText">大王很無聊，所以做了這個網頁給你。<br>點下面的按鈕吧。</p>
  <button class="btn" onclick="startChaos()">點我看看會發生什麼事</button>
  <div id="count"></div>
</div>

<div id="bombArea"></div>

<div id="fakeDead">
  <div>
    系統錯誤 0x00BORED<br><br>
    偵測到使用者太無聊<br>
    正在重新開機...<br><br>
    <span id="dots"></span>
  </div>
</div>

<script>
let clickCount = 0;
const messages = [
  "欸嘿 👀",
  "你猜這個網頁想幹嘛",
  "其實沒有要幹嘛",
  "我女友就是無聊",
  "然後她做了這個",
  "浪費你人生的幾十秒",
  "謝謝配合 🙏",
  "還沒結束喔",
  "繼續點啊",
  "你很聽話欸",
  "好了真的沒了",
  "騙你的，還有",
  "永無止盡版",
  "此按鈕已進入無限迴圈",
  "你可以選擇不相信我",
];

function startChaos() {
  clickCount++;
  document.getElementById('count').innerText = "已浪費你的人生：" + clickCount + " 次點擊";

  // 隨機飄出訊息
  const bombArea = document.getElementById('bombArea');
  const msg = document.createElement('div');
  msg.className = 'floaty';
  msg.innerText = messages[Math.floor(Math.random() * messages.length)];
  msg.style.left = Math.random() * 80 + 10 + '%';
  msg.style.top = Math.random() * 60 + 20 + '%';
  msg.style.color = `hsl(${Math.random()*360}, 80%, 60%)`;
  bombArea.appendChild(msg);
  setTimeout(() => msg.remove(), 3000);

  // 背景顏色隨機變化
  const colors = [
    'linear-gradient(135deg, #ffd6e8, #d6f0ff)',
    'linear-gradient(135deg, #d6ffe0, #fff6d6)',
    'linear-gradient(135deg, #e0d6ff, #ffd6d6)',
    'linear-gradient(135deg, #d6f7ff, #ffe8d6)',
  ];
  document.body.style.background = colors[Math.floor(Math.random() * colors.length)];

  // 每 7 次觸發假當機
  if (clickCount % 7 === 0) {
    fakeCrash();
  }

  // 按鈕文字隨點擊次數改變
  const btn = document.querySelector('.btn');
  if (clickCount > 20) {
    btn.innerText = "拜託不要再點了";
  } else if (clickCount > 10) {
    btn.innerText = "你真的很閒欸";
  } else if (clickCount > 3) {
    btn.innerText = "還要點喔";
  }
}

function fakeCrash() {
  const fd = document.getElementById('fakeDead');
  fd.style.display = 'flex';
  let dots = '';
  let i = 0;
  const interval = setInterval(() => {
    dots += '.';
    document.getElementById('dots').innerText = dots;
    i++;
    if (i > 15) {
      clearInterval(interval);
      fd.style.display = 'none';
      document.getElementById('mainText').innerText = "重開機完成，繼續浪費人生。";
    }
  }, 150);
}
</script>

</body>
</html>
